[package]
name = "position_manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "position_manager"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.29", features = ["init-if-needed"] }
anchor-spl = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
anchor-lang = { version = "0.29", features = ["init-if-needed"] }
